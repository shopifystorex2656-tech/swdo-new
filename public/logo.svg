<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Soft shadow for emblem depth -->
    <filter id="swdoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="innerDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Top Text Path for SHANGLA WELFARE & DEVELOPMENT ORG -->
    <path id="circlePathTop" d="M 62,250 A 188,188 0 1,1 438,250" fill="none" />
    <!-- Bottom Text Path for SWDO -->
    <path id="circlePathBottom" d="M 405,270 A 188,188 0 0,1 95,270" fill="none" />
  </defs>

  <!-- Outer Navy Blue Rim -->
  <circle cx="250" cy="250" r="242" fill="#ffffff" stroke="#064789" stroke-width="15"/>
  <circle cx="250" cy="250" r="185" fill="#ffffff" stroke="#064789" stroke-width="4"/>

  <!-- Curved Text: Top -->
  <text fill="#064789" font-family="'Inter', 'Arial Black', sans-serif" font-size="25.5" font-weight="900" letter-spacing="2.8">
    <textPath href="#circlePathTop" startOffset="50%" text-anchor="middle">
      SHANGLA WELFARE &amp; DEVELOPMENT ORG
    </textPath>
  </text>

  <!-- Curved Text: Bottom -->
  <text fill="#064789" font-family="'Inter', 'Arial Black', sans-serif" font-size="38" font-weight="900" letter-spacing="8">
    <textPath href="#circlePathBottom" startOffset="50%" text-anchor="middle">
      SWDO
    </textPath>
  </text>

  <!-- Central Graphic Group with shadow -->
  <g filter="url(#innerDrop)">
    <!-- Mountain Shelter Gable Roof -->
    <path d="M 250 108 L 372 208 L 338 208 L 338 235 L 162 235 L 162 208 L 128 208 Z"
          fill="#1b7837" stroke="#145a27" stroke-width="2" />

    <!-- Red Heart with White Border -->
    <g>
      <!-- White contour -->
      <path d="M 250 188 
               C 238 160, 195 156, 178 184 
               C 156 220, 218 270, 250 306 
               C 282 270, 344 220, 322 184 
               C 305 156, 262 160, 250 188 Z"
            fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
      <!-- Red inner heart -->
      <path d="M 250 193 
               C 240 168, 203 164, 188 189 
               C 169 221, 222 266, 250 298 
               C 278 266, 331 221, 312 189 
               C 297 164, 260 168, 250 193 Z"
            fill="#e11d24" />
    </g>

    <!-- Caring Protective Hands (Left & Right cupping) -->
    <!-- Left Hand & Fingers -->
    <path d="M 148 240 
             C 142 270, 172 328, 230 358 
             C 225 338, 215 315, 204 295 
             C 192 275, 175 252, 148 240 Z"
          fill="#1f8b3c" />
    <path d="M 132 258 
             C 134 290, 168 340, 222 366 
             C 200 350, 178 322, 165 292 
             C 152 265, 140 252, 132 258 Z"
          fill="#19712f" />

    <!-- Right Hand & Fingers -->
    <path d="M 352 240 
             C 358 270, 328 328, 270 358 
             C 275 338, 285 315, 296 295 
             C 308 275, 325 252, 352 240 Z"
          fill="#1f8b3c" />
    <path d="M 368 258 
             C 366 290, 332 340, 278 366 
             C 300 350, 322 322, 335 292 
             C 348 265, 360 252, 368 258 Z"
          fill="#19712f" />

    <!-- Lower Palm Base -->
    <path d="M 218 345 C 238 375, 250 382, 250 382 C 250 382, 262 375, 282 345 C 265 362, 235 362, 218 345 Z"
          fill="#155d27" />
  </g>
</svg>
